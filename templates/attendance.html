{% extends "base.html" %}

{% block content %}
<div class="card">
    <div class="card-title"><i class="fa-solid fa-eye"></i> Mark Attendance</div>
    <p class="card-sub">Look directly at the camera to authenticate your identity.</p>

    <div class="tip-box">
        <i class="fa-solid fa-lightbulb"></i>
        <span>Ensure good lighting and hold still. The scan takes less than a second once captured.</span>
    </div>

    <!-- Camera + iris overlay -->
    <div class="camera-wrapper" id="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none"></canvas>

        <!-- Iris ring overlay -->
        <div class="iris-overlay">
            <div class="iris-ring">
                <div class="iris-ring-outer"></div>
                <div class="iris-ring-inner"></div>
                <div class="iris-dots">
                    <div class="iris-dot"></div><div class="iris-dot"></div>
                    <div class="iris-dot"></div><div class="iris-dot"></div>
                    <div class="iris-dot"></div><div class="iris-dot"></div>
                    <div class="iris-dot"></div><div class="iris-dot"></div>
                </div>
            </div>
        </div>

        <!-- Corner brackets -->
        <div class="iris-corners">
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
        </div>

        <!-- Flash overlay -->
        <div class="camera-flash" id="camera-flash"></div>

        <!-- Status bar -->
        <div class="camera-status" id="camera-status">
            <div class="status-dot"></div>
            <span id="status-text">Initialising…</span>
        </div>
    </div>

    <div class="text-center mb-2" style="font-size:0.8rem;color:var(--muted)">
        <i class="fa-regular fa-clock"></i> <span id="live-clock"></span>
    </div>

    <button id="captureBtn" class="btn-full btn-purple">
        <i class="fa-solid fa-check-to-slot"></i> Authenticate
    </button>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
<script src="{{ url_for('static', filename='js/attendance.js') }}"></script>
{% endblock %}
